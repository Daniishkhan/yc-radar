services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    container_name: yc-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yc_radar
      POSTGRES_USER: yc_radar
      POSTGRES_PASSWORD: yc_radar
    ports:
      - "5433:5432"
    volumes:
      - yc_radar_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yc_radar -d yc_radar"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: yc-radar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  flower:
    image: mher/flower:2.0
    container_name: yc-radar-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"

volumes:
  yc_radar_postgres_data:
