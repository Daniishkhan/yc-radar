services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    container_name: yc-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yc_radar
      POSTGRES_USER: yc_radar
      POSTGRES_PASSWORD: yc_radar
    ports:
      - "5433:5432"
    volumes:
      - yc_radar_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yc_radar -d yc_radar"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  yc_radar_postgres_data:
