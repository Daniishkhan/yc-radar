name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-trixie
        env:
          POSTGRES_DB: yc_radar
          POSTGRES_USER: yc_radar
          POSTGRES_PASSWORD: yc_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yc_radar -d yc_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://yc_radar:yc_radar@localhost:5432/yc_radar
      YC_RADAR_TEST_DATABASE_URL: postgresql+psycopg://yc_radar:yc_radar@localhost:5432/yc_radar
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install locked dependencies
        run: uv sync --extra dev --locked
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check migration state
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check src tests scripts migrations

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check whether this push is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_revision=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq .object.sha)
          if [[ ${current_revision} == "${DEPLOY_REVISION}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Skipping superseded push ${DEPLOY_REVISION}; main is ${current_revision}"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Join the production tailnet
        if: steps.revision.outputs.deploy == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: radar-worker
      - name: Recheck main after joining the tailnet
        if: steps.revision.outputs.deploy == 'true'
        id: confirmed-revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_revision=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq .object.sha)
          if [[ ${current_revision} == "${DEPLOY_REVISION}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Skipping superseded push ${DEPLOY_REVISION}; main is ${current_revision}"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Deploy the tested revision over Tailscale SSH
        if: steps.confirmed-revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${GITHUB_SHA} =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA must be a full lowercase Git commit SHA" >&2
            exit 1
          }
          tailscale ssh ubuntu@radar-worker \
            "sudo /usr/local/sbin/radar-deploy --revision '${GITHUB_SHA}'"
