name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-trixie
        env:
          POSTGRES_DB: yc_radar
          POSTGRES_USER: yc_radar
          POSTGRES_PASSWORD: yc_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yc_radar -d yc_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://yc_radar:yc_radar@localhost:5432/yc_radar
      YC_RADAR_TEST_DATABASE_URL: postgresql+psycopg://yc_radar:yc_radar@localhost:5432/yc_radar
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install locked dependencies
        run: uv sync --extra dev --locked
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check migration state
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check src tests scripts migrations

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AWS_REGION:?Set AWS_REGION on the production environment}"
          : "${AWS_STACK_NAME:?Set AWS_STACK_NAME on the production environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN on the production environment}"
          [[ ${AWS_ACCOUNT_ID} =~ ^[0-9]{12}$ ]] || {
            echo "AWS_ACCOUNT_ID must be a 12-digit production environment variable" >&2
            exit 1
          }
      - name: Assume the production deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: yc-radar-${{ github.run_id }}
          role-duration-seconds: 7200
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Deploy the tested revision through SSM
        shell: bash
        run: |
          set -Eeuo pipefail
          ./infra/aws/worker-ssm.sh \
            --region "${AWS_REGION}" \
            --stack-name "${AWS_STACK_NAME}" \
            deploy "${GITHUB_SHA}"
