[project]
name = "yc-radar"
version = "0.1.0"
description = "A script-first local hiring radar for global software-engineering opportunities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.40.0",
    "botocore[crt]>=1.40.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=5.0.0",
    "sqlalchemy>=2.0.49",
]

[project.optional-dependencies]
ai = [
    "firecrawl-py>=4.25.0",
    "openai>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
