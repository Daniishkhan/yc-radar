name: yc-radar

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yc_radar}
      POSTGRES_USER: ${POSTGRES_USER:-yc_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment env file}
    volumes:
      - yc_radar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: yc-radar:latest
    build:
      context: .
    init: true
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yc_radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yc_radar}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/local:/app/data/local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yc_radar_postgres_data:
